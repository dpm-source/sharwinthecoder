<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather report </title>
    <style>
        *{
            box-sizing:border-box;
            padding:0px;
            font-family: Arial, sans-serif;
        }
        .title{
            text-align:center;
            color:white;
        }
        body{
            
            background-color: #87ceeb;
            background-image: radial-gradient(circle, white 2px, transparent 3px);
            background-size: 40px 40px;
            background-repeat: repeat;
            background-position: top center;
            background-attachment: fixed;
            color:white;
            text-align:center;
           
           
           
           

        }
        .sub{
            text-align:center;
            color:white;
            font-size:30px;


        }
        hr{
            border: 1px solid white;
        }
        .weather-card{
           
            width:400px;
            border:3px solid white;
            border-radius: 20px;
      background-image: linear-gradient(to bottom right, #1e90ff, #87cefa);
      

        }
        .details{
            font-size:20px;
            font-family: Arial, sans-serif;
        }
        .icon{
            font-size:70px;
            animation: floatCloud 3s infinite alternate;
        }
        img{
            width:100px;
            height:100px;
            position:relative;
        }



    </style>
</head>
<body>
    <h1 class="title">My Weather Home Page App</h1><img src="https://cdn-icons-png.flaticon.com/512/1163/1163661.png" alt="weather icon">
    <p class="sub">Check today's weather and plan your day better.</p>
    <hr><br><hr>
    <div class="weather-card">
        <h2>Today's Weather</h2>
       <div class="icon">Cloud ☁️</div>
            
        
        <p class="details">city:chennai</p>
        <p class="details">condition:partly sunny</p>
        <p class="details">temperature: 30°C</p>
        <p class="details">humidity: 60%</p>
        <p class="details">wind speed: 10 km/h</p>



    </div>

    


    
    
</body>
</html>
