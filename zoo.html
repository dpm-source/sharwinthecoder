<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0px;
        }
        body{
            font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: rgb(25, 165, 25);
            
        }
        .alert{
            text-align: center;
            
            font-weight: bold;
            position:fixed;
            top:0;
            right:0;
            left:0;
            background-color: green;
            border: 2px solid green;
        }
        h1{
            text-align: center;
            background-color: chartreuse;
            padding:10px;
            
           
            
            
            
        }
        .entry{
            text-align: center;
            font-size: 20px;
            width: 500px;
            height: 500px;
            background-color: chartreuse;
            margin-top: 10px;
            padding: 10px;
            border-radius: 20px;
            border: 2px solid green;
        }
        #lion{
            margin:20px;
            background-color:rgb(25, 165, 25);
            font-weight: bold;
            width: 400px;
            height: 50px;
            padding:10px;
            border-radius: 15px;
            border: 2px solid green;
            position: static;
            color: antiquewhite;
        }
        #dolphin{
             margin:20px;
            background-color:rgb(25, 165, 25);
            font-weight: bold;
            width: 400px;
            height: 50px;
            padding:10px;
            border-radius: 15px;
            border: 2px solid green;
            position: static;
            color:antiquewhite
        }
        #penguin{
             margin:20px;
            background-color:rgb(25, 165, 25);
            font-weight: bold;
            width: 400px;
            height: 50px;
            padding:10px;
            border-radius: 15px;
            border: 2px solid green;
            color: antiquewhite;
        }
        .rescued{
            text-align: center;
            width: 500px;
            height:500px;
            background-color: chartreuse;
            margin-top: 10px;
            border-radius: 20px;
            padding:10px;
            border:2px solid green;
            

        }
        #animal{
            margin: 20px;
            background-color:rgb(106, 201, 12);
            width: 400px;
            height:50px;
            color:antiquewhite;
            font-weight: bold;
            border: 2px solid green;
            border-radius: 15px;
            padding:10px;
        }
        #animalrescued{
            margin: 20px;
            background-color:rgb(25, 165, 25) ;
            width: 400px;
            height:50px;
            color:antiquewhite;
            font-weight: bold;
            border: 2px solid green;
            border-radius: 15px;
            padding:10px;
            
            transition:1s;
        }
     #animalrescued:hover{
        background-color:rgb(106, 201, 12) ;
      
        position:relative;
        left:35px;
        
     }
     .card{
         position: relative;
      background: white;
      border: 2px solid #52b788;
      border-radius: 10px;
      padding: 25px;
      width: 230px;
      text-align: center;
    
     }
     #tag{
       position: absolute;
      top: -10px;
      right: -10px;
      background: #f77f00;
      color: white;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
     }


    </style>
</head>
<body>
    <div class="alert">Zoo Rescue Alert - Emergency team active</div>
    <h1>Zoo rescue tracker</h1>
    <div class="entry">
        <h2>animal rescue entry</h2>
        <p id="lion">Lion:rest zone</p>
        <p id="dolphin">dolphin:water zone</p>
        <p id="penguin">penguin:ice zone</p>


    </div>
    <div class="rescued">
        <h2>rescued animals</h2>
        <p id="animal">giraffe:inspecting</p>
        <p id="animalrescued">bear:safe</p>
        <p id="animal">pigeon:inspecting</p>

    </div>
    <div class="card">
        panda <br>
        inspection completed
        <div id="tag">Safe</div>

    </div>
    


    
</body>
</html>
