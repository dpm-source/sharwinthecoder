<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Donation Form</title>
</head>
<body>
    <h1>📚 Book Donation Form</h1>
    <p>Fill in the form below to donate books to the library!</p>

    <form>
         <fieldset>
        <legend>Donor Details</legend>
        <label for="name">Your Name</label><br> 

        <input type="text" id="name"placeholder="Enter your full name"><br><br>
        <label for="donor">Donor ID</label><br>
        <input type="password" id="donor" placeholder="Enter your donor ID"><br><br>
        <label for="date">Donation date</label><br>
        <input type="date" id =date placeholder="Enter the date of donation"><br>
        
        
       
        

    </fieldset>
     
    <fieldset>
        <legend>Book Details</legend>
         <label>Choose a book category</label><br>
         <select name="" id="category">
         <option value="">--select a category--</option>
         <option value="fiction">fiction</option>
         <option value="science">science</option>
         <option value="history">history</option>
         <option value="education">education</option>
         </select><br><br>

         <label>Book condition</label><br>
         <input type="radio" name="condition" value="new">Like new <br>
         <input type="radio" name="condition" value="used">Used <br>
         <input type="radio" name="condition" value="old">old <br>

       


         

         



         


    </fieldset>
    <br>
    <fieldset>
        <legend>Prefered drop off</legend>
        <input type="radio" name="condition" value="monday">monday <br>
        <input type="radio" name="condition" value="wednaesday">wednesday
         

    </fieldset>
    <br>
    <input type="submit" value="Donate your book">
    
</body>
