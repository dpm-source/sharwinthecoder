<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cartoon Character Card</title>
    <style>
        *{
            box-sizing:border-box;
            padding:0px;
            text-align:center;
            background-color:moccasin;
        }
        hr{
            border:2px solid black;
        }
        h2{
            color:rgb(8, 8, 180);
            cursor:pointer;
            text-decoration:underline;
        }
        .title{
            font-size:20px;
            background-color:lightblue;
            
        }
        .cartoon-detail{
            font-size:20px;
            color:crimson;
            background-color:lightblue
        }
        div{
            height:400px;
            width:500px;
            border:2px solid red;
            background-color:lightblue;
            text-align:center;

        }



    </style>
</head>
<body>
    <h1>My Favourite Cartoon Charachter</h1>
    <h2>check out my charachter</h2>
    <hr>
    <div>
        <h2 class="title">Details about my charachter</h2>
         <p class="cartoon-detail">Character Name: Doraemon</p>
    <p class="cartoon-detail">Best Friend: Nobita</p>
    <p class="cartoon-detail">Favourite Food: Dorayaki</p>
    <p class="cartoon-detail">Special Power: Future Gadgets</p>

    </div>

    
</body>
</html>
